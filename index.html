<body><div id="app">
<header class="top"><div class="title" id="title">無題</div><div class="commands">
<button id="fit">全体表示</button><button id="zoom100">100%</button><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">＋</button>
<button id="exportPng">画像出力</button><button id="newBtn">新規</button><button id="openBtn">開く</button><button id="saveBtn">保存</button><input id="fileInput" type="file" accept="application/json,.activity.json,.json" hidden>
<div class="version" id="fileVersionText">Ver.未保存</div></div></header>
<main class="main"><aside class="side">
<section class="accordion" id="laneAcc"><button class="accHead">レーン <span>▴</span></button><div class="accBody"><select id="laneSelect" hidden></select><div class="row"><label>名称</label><input id="laneName"></div><div class="row laneColorRow"><label>カラー</label><div class="swatches" id="swatches"></div></div><div class="actions laneActions"><button id="delLane">削除</button><button id="upLane">↑上へ</button><button id="downLane">↓下へ</button></div></div></section>

let fileRevision=null;function updateFileVersionDisplay(){$('#fileVersionText').textContent=fileRevision===null?'Ver.未保存':'Ver.'+fileRevision}let view={scale:1,x:0,y:0}, selectedCards=new Set(), selectedLinks=new Set(), selectedSymbol=null, activeLane=null, dayCtx=null, drag=null, linkDrag=null, editCard=null, undoStack=[],redoStack=[],lastCommittedState=null,historyApplying=false,generatedActionActive=false,currentDataHandle=null,lastLaneId=null,lastCardId=null,lastLinkId=null,lastSymbolId=null,selectionType=null,autoOpenedAcc=new Set();const HISTORY_LIMIT=30;
function uid(){return Math.random().toString(36).slice(2,9)} function mixHex(a,b,t){let pa=a.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16)),pb=b.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16));return'#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('')} function fmtDay(n){return n===0?'N日':`N${n>0?'+':''}${n}`}

function snapshotState(){return JSON.stringify(state)}function initializeHistory(){lastCommittedState=snapshotState();undoStack=[];redoStack=[]}function commitHistory(){let current=snapshotState();if(historyApplying){lastCommittedState=current;return}if(lastCommittedState===null){lastCommittedState=current;return}if(current!==lastCommittedState){undoStack.push(lastCommittedState);if(undoStack.length>HISTORY_LIMIT)undoStack.shift();redoStack=[];lastCommittedState=current}}function restoreHistory(raw,msg){historyApplying=true;restoreAutoOpenedAcc();state=JSON.parse(raw);autoOpenedAcc.clear();selectionType=null;selectedCards.clear();selectedLinks.clear();selectedSymbol=null;activeLane=null;lastLaneId=null;lastCardId=null;lastLinkId=null;lastSymbolId=null;editCard=null;sanitize();lastCommittedState=snapshotState();historyApplying=false;$('#title').textContent=displayFileName(state.fileName);render();setStatus(msg,false)}function undo(){if(!undoStack.length)return setStatus('元に戻せる操作がありません');let current=snapshotState(),previous=undoStack.pop();redoStack.push(current);if(redoStack.length>HISTORY_LIMIT)redoStack.shift();restoreHistory(previous,'操作を元に戻しました')}function redo(){if(!redoStack.length)return setStatus('やり直せる操作がありません');let current=snapshotState(),next=redoStack.pop();undoStack.push(current);if(undoStack.length>HISTORY_LIMIT)undoStack.shift();restoreHistory(next,'操作をやり直しました')}function touch(msg='変更を反映しました'){state.updated=new Date().toISOString();commitHistory();setStatus(msg)}

function sanitize(){state.days=[...new Set(state.days.map(Number))].sort((a,b)=>a-b);if(!state.days.includes(0))state.days.push(0),state.days.sort((a,b)=>a-b);state.lanes=state.lanes||[];state.cards=state.cards||[];state.links=state.links||[];state.symbols=state.symbols||[];state.links=state.links||[];state.cardLabelProperty=['no','workClass','variation','personnel','difficulty'].includes(state.cardLabelProperty)?state.cardLabelProperty:'no';state.cards.forEach(c=>{c.x=Number.isFinite(c.x)?c.x:0;c.y=Number.isFinite(c.y)?c.y:0;c.workClass=['正味','付随','ムダ'].includes(c.workClass)?c.workClass:'正味';c.variation=Number.isFinite(+c.variation)&&+c.variation>=0?+c.variation:0;c.personnel=Number.isFinite(+c.personnel)&&+c.personnel>=1?Math.floor(+c.personnel):1;c.difficulty=['高','中','低'].includes(c.difficulty)?c.difficulty:'中'});state.symbols.forEach(q=>{q.type=q.type||(q.image?'image':q.text==='注記'?'callout':q.text==='○'?'ellipse':q.text==='テキスト'?'rounded':'rect');q.align=q.align||'left-top';q.textColor=q.textColor||'#111111';q.fill=q.fill||'#a8dded';q.fontSize=q.fontSize||14;q.tailX=Number.isFinite(q.tailX)?q.tailX:-16;q.tailY=Number.isFinite(q.tailY)?q.tailY:(q.h||46)+20;q.bold=!!q.bold;q.italic=!!q.italic;q.underline=!!q.underline;q.strike=!!q.strike});compactLayout();renumber()}
function dayWidths(days){return days.map(d=>{let cols=dayCols(d);return MARGIN_START+cols*CARD_W+(cols-1)*GAP_X+MARGIN_END})}
function laneCols(l){let cs=laneCards(l.id);return cs.length>=2?Math.max(2,...cs.map(c=>(c.x||0)+1)):1}function dayCols(day){let all=state.cards.filter(c=>c.day===day);return all.length?Math.max(1,...all.map(c=>(c.x||0)+1)):1}function dayRows(l,day){let cs=laneCards(l.id).filter(c=>c.day===day);return cs.length?Math.max(...cs.map(c=>(c.y||0)+1)):1}function dayTopSlots(l,day){return 0}function laneHeight(l){let maxVisualRows=Math.max(1,...state.days.map(d=>dayTopSlots(l,d)+dayRows(l,d)));return MARGIN_START+maxVisualRows*CARD_H+(maxVisualRows-1)*GAP_Y+MARGIN_END}

function render(){sanitize();let days=visibleDays(),widths=dayWidths(days),chart=$('#chart');chart.innerHTML='';chart.style.gridTemplateColumns=`174px ${widths.map(w=>w+'px').join(' ')}`;
let corner=document.createElement('div');corner.className='corner';corner.innerHTML=`<button class="tri ${state.hideEmpty?'is-right':'is-left'}" title="空の日を表示/非表示"></button>`;corner.onclick=()=>{state.hideEmpty=!state.hideEmpty;render();touch(state.hideEmpty?'空の日を非表示':'すべての日を表示')};chart.append(corner);

state.lanes.forEach(l=>{let st=stats(l),h=document.createElement('div');h.className='laneHead'+(l.collapsed?' laneCollapsed':'')+(selectionType==='lane'&&activeLane===l.id?' activeLane':'');h.style.background=l.color;h.dataset.lane=l.id;h.innerHTML=`<div class="laneTools"><strong>${esc(l.name)}</strong><button class="tri">${l.collapsed?'▼':'▲'}</button></div>${l.collapsed?'':statMarkup(st.total,st.lt)}`;h.onclick=()=>selectLane(l.id);h.ondblclick=()=>editLane(l.id);h.querySelector('.tri').onclick=e=>{e.stopPropagation();l.collapsed=!l.collapsed;render();touch('レーン表示を変更しました')};chart.append(h);
days.forEach((d,di)=>{let cell=document.createElement('div');cell.className='cell'+(l.collapsed?' laneCollapsed':'');cell.dataset.lane=l.id;cell.dataset.day=d;cell.style.width=widths[di]+'px';cell.style.height=laneHeight(l)+'px';let cards=laneCards(l.id).filter(c=>c.day===d).sort((a,b)=>(a.y||0)-(b.y||0)||(a.x||0)-(b.x||0)),rows=Math.max(1,...state.days.map(day=>dayRows(l,day))),topSlots=dayTopSlots(l,d),cols=dayCols(d),occupied=new Set(cards.map(c=>`${c.x||0},${(c.y||0)+topSlots}`)),made=new Set();let addMarker=(left,top,x,y,axis)=>{let key=markerKey(x,y,axis);if(made.has(key))return;made.add(key);let b=document.createElement('button');b.className='add'+(['empty','top-slot'].includes(axis)?' placementSlot':'');b.title='カード追加';b.setAttribute('aria-label','カード追加');b.dataset.x=x;b.dataset.y=y;b.dataset.axis=axis;b.style.left=left+'px';b.style.top=top+'px';b.onmouseenter=()=>setStatus('クリックしてカードを追加');b.onmouseleave=()=>setStatus('余白をドラッグして移動、ホイールで拡大縮小。カード間の緑丸をドラッグして接続できます。');b.onclick=e=>{e.stopPropagation();if(e.ctrlKey)return;newCard(l.id,d,x,y,axis)};cell.append(b)};let cx=x=>MARGIN_START+x*(CARD_W+GAP_X)+CARD_W/2,cy=y=>MARGIN_START+y*(CARD_H+GAP_Y)+CARD_H/2,totalRows=rows+topSlots;
/* Every unoccupied placement slot gets exactly one centered marker. */

cards.filter(c=>c.group).forEach(c=>{let count=Math.max(0,c.group.length-1);for(let i=count;i>=1;i--){let back=document.createElement('div');back.className='groupStackVisual';back.style.setProperty('--cardColor',l.color);back.style.left=(MARGIN_START+(c.x||0)*(CARD_W+GAP_X)+i*4)+'px';back.style.top=(MARGIN_START+((c.y||0)+dayTopSlots(l,c.day))*(CARD_H+GAP_Y)+i*4)+'px';cell.append(back)}});cards.forEach(c=>cell.append(cardEl(c,l)));cell.onclick=e=>{if(e.target===cell&&!e.shiftKey)clearSelection()};chart.append(cell)})});requestAnimationFrame(()=>{layoutScene(days);drawLinks(days);renderSymbols(days);renderFixedHeaders(days);applyView()});renderSide()}
