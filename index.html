<body><div id="app">
<header class="top"><div class="title" id="title">無題</div><div class="commands">
<button id="fit">全体表示</button><button id="zoom100">100%</button><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">＋</button>
<button id="exportPng">画像出力</button><button id="newBtn">新規</button><button id="openBtn">開く</button><button id="saveBtn">保存</button><input id="fileInput" type="file" accept="application/json,.activity.json,.json" hidden>
<div class="version">Ver.3.40<br><span id="updated"></span></div></div></header>
<main class="main"><aside class="side">
<section class="accordion" id="laneAcc"><div class="accTitleRow"><button class="accHead">レーン <span>▴</span></button><button id="addLaneHead" class="accAdd" type="button" title="レーンを追加">＋新規</button></div><div class="accBody"><div class="row"><label>対象</label><select id="laneSelect"></select></div><div class="row"><label>名称</label><input id="laneName"></div><div class="laneColorTitle">レーンカラー</div><div class="swatches" id="swatches"></div><div class="actions"><button id="delLane">削除</button><button id="upLane">↑上へ</button><button id="downLane">↓下へ</button></div></div></section>
<section class="accordion collapsed" id="cardAcc"><button class="accHead">カード <span>▾</span></button><div class="accBody"><div class="row"><label>No</label><input id="cardNo" disabled></div><div class="row"><label>アクション</label><textarea id="cardAction"></textarea></div><div class="row"><label>所要時間</label><input id="cardDuration" type="number" min="0"> 分</div><div class="actions"><button id="applyCard">変更</button><button id="groupCards">グループ化</button><button id="ungroupCard">解除</button><button id="delCard">削除</button></div></div></section>
<section class="accordion collapsed" id="linkAcc"><button class="accHead">コネクタ <span>▾</span></button><div class="accBody"><div class="row linkPropRow"><label>色</label><div id="linkColorPalette" class="linkPalette" aria-label="コネクタの色"></div></div><div class="row linkPropRow"><label>太さ</label><div id="linkWidthButtons" class="linkOptionButtons" aria-label="コネクタの太さ"><button type="button" data-link-width="1.2" aria-label="細線"><i style="border-top-width:1px"></i></button><button type="button" data-link-width="1.8" aria-label="標準線"><i style="border-top-width:2px"></i></button><button type="button" data-link-width="3" aria-label="太線"><i style="border-top-width:3px"></i></button></div></div><div class="row linkPropRow"><label>線種</label><div id="linkDashButtons" class="linkOptionButtons" aria-label="コネクタの線種"><button type="button" data-link-dash="" aria-label="実線"><i class="solid"></i></button><button type="button" data-link-dash="8 5" aria-label="破線"><i class="dashed"></i></button><button type="button" data-link-dash="2 5" aria-label="点線"><i class="dotted"></i></button></div></div></div></section>
<section class="accordion collapsed" id="symAcc"><button class="accHead">シンボル <span>▾</span></button><div class="accBody"><div class="actions"><button data-sym="テキスト">テキスト</button><button data-sym="注記">吹き出し</button><button data-sym="★">アイコン</button><button data-sym="□">四角形</button><button data-sym="○">円</button><button id="imageSymBtn">画像</button><input id="imageSymInput" type="file" accept="image/*" hidden></div><div class="row"><label>文字</label><input id="symText"></div><div class="row"><label>輪郭</label><input id="symStroke" type="color" value="#665baa"></div><div class="row"><label>塗り</label><input id="symFill" type="color" value="#f0ecff"></div><div class="row"><label>文字色</label><input id="symTextColor" type="color" value="#17201e"></div><div class="row"><label>文字サイズ</label><input id="symFontSize" type="number" min="8" max="72" value="14"></div><button class="toolBtn" id="applySym">適用</button></div></section>
</aside><section class="workspace" id="workspace"><div id="fixedDays" class="fixedDays"></div><div id="fixedLanes" class="fixedLanes"></div><div id="fixedCorner" class="fixedCorner"></div><div class="scene" id="scene"><div class="chart" id="chart"></div><svg class="links" id="links"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#63706c"/></marker><marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c83d3d"/></marker></defs></svg><div id="symbols"></div></div></section></main>
<footer class="status" id="status"><span>余白をドラッグして移動、ホイールで拡大縮小。カード間の緑丸をドラッグして接続できます。</span><span id="selectionInfo">選択なし</span></footer></div>
<div class="menu hidden" id="dayMenu"><button data-dayop="left">左に追加</button><button data-dayop="right">右に追加</button><button data-dayop="delete">削除</button></div>
<dialog id="cardDialog"><form method="dialog" class="dlg"><h3 id="cardDlgTitle">カード</h3><div class="row"><label>アクション</label><textarea id="dlgAction" required></textarea></div><div class="row"><label>所要時間</label><input id="dlgDuration" type="number" min="0" value="1"> 分</div><menu><button value="save" class="primary" id="dlgSave">保存</button><button value="cancel" formnovalidate>取消</button></menu></form></dialog>
<dialog id="laneDialog"><form method="dialog" class="dlg"><h3>レーン設定</h3><div class="row"><label>名称</label><input id="dlgLaneName"></div><div class="row"><label>色</label><input id="dlgLaneColor" type="color"></div><div class="actions"><button type="button" id="dlgLaneUp">↑上へ</button><button type="button" id="dlgLaneDown">↓下へ</button></div><menu><button value="cancel">取消</button><button value="save" class="primary" id="dlgLaneSave">保存</button></menu></form></dialog>
<dialog id="reverseLinkDialog"><form method="dialog" class="dlg"><h3>コネクタの接続方向</h3><p>コネクタが逆戻りしています。カードを移動するか戻りコネクタかを選択してください</p><menu><button value="move" class="primary" id="reverseMove" autofocus>カード移動</button><button value="return">戻りコネクタ</button></menu></form></dialog>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const colors=['#c6edf8','#d4f3df','#fffbc7','#fde3d4','#eadcf8','#dce8ff','#f9d9e6','#d9f2ef','#a8dded','#b5e5c7','#f6ef9d','#f6c8ad','#d2b9ed','#bed1fa','#f0b8d0','#b9e3dd'];
const CARD_W=132,CARD_H=CARD_W*.8,UNIT=CARD_W*.25,MARGIN_START=UNIT,MARGIN_END=CARD_W*.3,GAP_X=UNIT,GAP_Y=UNIT;
let state={version:2,fileName:'無題.json',days:[0],lanes:[{id:uid(),name:'名称未設定',color:colors[0],collapsed:false}],cards:[],links:[],symbols:[],hideEmpty:false,updated:new Date().toISOString()};function displayFileName(name){return String(name||'無題').replace(/(?:\.activity)*\.json$/i,'')}function createBlankState(){return{version:2,fileName:'無題.json',days:[0],lanes:[{id:uid(),name:'名称未設定',color:colors[0],collapsed:false}],cards:[],links:[],symbols:[],hideEmpty:false,updated:new Date().toISOString()}}
let view={scale:1,x:0,y:0}, selectedCards=new Set(), selectedLinks=new Set(), selectedSymbol=null, activeLane=null, dayCtx=null, drag=null, linkDrag=null, editCard=null, undoStack=[],redoStack=[],lastCommittedState=null,historyApplying=false,generatedActionActive=false,currentDataHandle=null,lastLaneId=null,lastCardId=null,lastLinkId=null,lastSymbolId=null,selectionType=null,autoOpenedAcc=new Set();const HISTORY_LIMIT=30;
function uid(){return Math.random().toString(36).slice(2,9)} function mixHex(a,b,t){let pa=a.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16)),pb=b.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16));return'#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('')} function fmtDay(n){return n===0?'N日':`N${n>0?'+':''}${n}`}
function statMarkup(total,lt){return`<div class="statGrid"><span class="statLabel">所要時間計：</span><span class="statValue">${total} 分</span><span class="statLabel">リードタイム：</span><span class="statValue">${lt}日</span></div>`}function laneCards(id){return state.cards.filter(c=>c.laneId===id)} function stats(l){let a=laneCards(l.id); return {total:a.reduce((s,c)=>s+(+c.duration||0),0),lt:a.length?Math.max(...a.map(c=>c.day))-Math.min(...a.map(c=>c.day)):0}} function overallStats(){let a=state.cards;return{total:a.reduce((sum,c)=>sum+(+c.duration||0),0),lt:a.length?Math.max(...a.map(c=>c.day))-Math.min(...a.map(c=>c.day)):0}}
